/* =====================================================================

const TILE = 16, VW = 512, VH = 288, SC = 2, ROWS = 18, GY = 15;

  clamp: (v, a, b) => v < a ? a : v > b ? b : v,

  rng(seed) {

  hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); },

  dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); },

const TRACKS = SONGS;
const DRUMS = {
  pop:    { k:'x.......x.x.....', s:'....x.......x...', h:'x.x.x.x.x.x.x.x.' },
  rock:   { k:'x.....x.x.......', s:'....x.......x...', h:'x.x.x.x.x.x.x.o.' },
  march:  { k:'x.......x.......', s:'....x..x....x.xx', h:'' },
  bossa:  { k:'x..x....x..x....', r:'x..x..x...x..x..', sh:'x.x.x.x.x.x.x.x.' },
  latin:  { k:'x..x....x..x....', s:'....x.......x...', sh:'xxxxxxxxxxxxxxxx', r:'..x...x...x.x...' },
  funk:   { k:'x.....x...x.....', s:'....x..x.x..x...', h:'xxxxxxxxxxxxxxxx' },
  shuffle:{ k:'x.......x.......', s:'....x.......x...', h:'x.x.x.x.x.x.x.x.' },
  epic:   { k:'x...x...x...x...', s:'....x.......x..x', h:'x.x.x.x.x.x.x.x.' },
  ballad: { k:'x.......x.......', s:'........x.......', h:'x...x...x...x...' },
  spooky: { k:'x.......x..x....', s:'........x.......', h:'..x...x...x...x.' },

const RHYTHMS = [
  [[0,4],[4,2],[6,2],[8,4],[12,4]], [[0,3],[3,3],[6,2],[8,6],[14,2]], [[0,2],[2,2],[4,4],[8,2],[10,2],[12,4]], [[0,6],[6,2],[8,2],[10,2],[12,4]],
  [[2,2],[4,2],[6,4],[10,2],[12,4]], [[0,4],[4,4],[8,8]], [[0,2],[2,1],[3,3],[6,2],[8,2],[10,6]], [[0,1],[1,1],[2,2],[4,4],[8,4],[12,2],[14,2]],
  [[0,3],[3,1],[4,2],[6,2],[8,3],[11,1],[12,4]], [[0,8],[8,4],[12,4]],
];
const INST_LEVEL = { brass:0.11, strings:0.09, flute:0.14, piano:0.13, marimba:0.15, pluck:0.12, bell:0.1, organ:0.07, synth:0.08 };

class SoundEngine {
  constructor() { this.ctx = null; this.muted = false; this.song = null; this.track = null; this.trackName = null; this.step = 0; this.nextTime = 0; this.cache = {}; this.pending = null; this.coinT = 0; this.coinN = 0; this.mVol = 1; this.sVol = 1; }
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.9;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.2;
    this.master.connect(comp); comp.connect(c.destination);
    this.musicGain = c.createGain(); this.musicGain.gain.value = 0.45 * this.mVol; this.musicGain.connect(this.master);
    this.sfxGain = c.createGain(); this.sfxGain.gain.value = 1.15 * this.sVol; this.sfxGain.connect(this.master);
    const len = c.sampleRate; this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const nd = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;
    // convolution reverb
    const rl = Math.floor(c.sampleRate * 2.4), ir = c.createBuffer(2, rl, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < rl; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.6); }
    this.reverb = c.createConvolver(); this.reverb.buffer = ir; this.revSend = c.createGain(); this.revSend.gain.value = 0.55;
    this.revSend.connect(this.reverb); this.reverb.connect(this.musicGain);
    this.echoIn = this.revSend;
    setInterval(() => this.schedule(), 25);
    if (this.pending) { const p = this.pending; this.pending = null; this.trackName = null; this.play(p); }
  }
  setVol(m, sv) { this.mVol = m; this.sVol = sv; if (this.musicGain) { this.musicGain.gain.value = 0.45 * m; this.sfxGain.gain.value = 1.15 * sv; } }
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.02); }

  /* ---------- composition ---------- */
  compose(name) {
    if (this.cache[name]) return this.cache[name];
    const S = SONGS[name] || SONGS.map, r = Util.rng(S.seed * 7919 + 3), sc = SCALES[S.scale];
    const d2m = (deg, base) => base + Math.floor(deg / 7) * 12 + sc[((deg % 7) + 7) % 7];
    const fill8 = p => { const o = []; while (o.length < 8) o.push(...p); return o.slice(0, 8); };
    const form = [fill8(S.A), fill8(S.A), fill8(S.B), fill8(S.A)], chords = form.flat(), bars = chords.length, len = bars * 16;
    const ev = Array.from({ length:len }, () => []);
    const add = (step, e) => { if (step >= 0 && step < len) ev[step].push(e); };
    const lead = SONGS[name].lead, ballad = S.style === 'ballad' || S.style === 'spooky';
    // ---- melody: motif-based phrases
    const pickR = (endLong) => { let c; do { c = RHYTHMS[Math.floor(r() * RHYTHMS.length)]; } while (endLong && c[c.length - 1][1] < 4); return ballad && r() < 0.6 ? RHYTHMS[[5, 9, 3][Math.floor(r() * 3)]] : c; };
    const makeMotif = () => ({ r1:pickR(false), r2:pickR(true), dir:r() < 0.5 ? 1 : -1, start:7 + Math.floor(r() * 4) });
    const motifs = { A:makeMotif(), B:makeMotif() }; motifs.B.start += 2;
    const melodyBars = [];
    const genPhrase = (m, barIdx, cadence, lift) => {
      let cur = m.start + lift;
      for (let pb = 0; pb < 4; pb++) {
        const ch = chords[barIdx + pb], rh = pb % 2 === 0 ? m.r1 : m.r2, notes = [];
        rh.forEach(([st, du], i) => {
          const strong = st % 8 === 0 || du >= 6;
          if (strong) { let best = cur, bd = 99; for (const t of [ch, ch + 2, ch + 4]) for (const o of [0, 7, 14]) { const cd = t + o; const dd = Math.abs(cd - cur); if (dd < bd && cd >= 5 && cd <= 17) { bd = dd; best = cd; } } cur = best; }
          else { const dir = (pb < 2 ? m.dir : -m.dir); cur = Util.clamp(cur + (r() < 0.7 ? dir : -dir) * (r() < 0.8 ? 1 : 2), 5, 17); }
          notes.push({ st, du, deg:cur, v:strong ? 1 : 0.8 });
        });
        if (pb === 3 && notes.length) { const last = notes[notes.length - 1]; last.deg = cadence ? 7 : ch + 7 > 17 ? ch : ch + 7; last.du = Math.max(last.du, 4); }
        melodyBars[barIdx + pb] = notes;
      }
    };

    }));

    melodyBars.forEach((notes, b) => { for (let i = 0; i < notes.length; i++) { const end = notes[i].st + notes[i].du, next = i + 1 < notes.length ? notes[i + 1].st : 16;
      if (next - end >= 4 && S.counter) { const ch = chords[b]; add(b * 16 + end, { i:S.counter, m:d2m(ch + 4, S.key), d:2, v:0.6, pan:0.35 }); add(b * 16 + end + 2, { i:S.counter, m:d2m(ch + 2, S.key), d:2, v:0.5, pan:0.35 }); } } });
    // ---- pad / comping with voice leading
    let prevVoicing = [55, 59, 62];

    const km = { Enter:['confirm'], NumpadEnter:['confirm'], Space:['confirm'], Escape:['pause','back'], Tab:['back'], ArrowUp:['nav_up'], ArrowDown:['nav_down'], ArrowLeft:['nav_left'], ArrowRight:['nav_right'] };

    this.keymap = km;
  }
  press(b, src = 'k') {
    if (!this.down[b]) this.pressed[b] = true;
    this.down[b] = true; (this.src[b] = this.src[b] || new Set()).add(src);
  }
  release(b, src = 'k') {
    const s = this.src[b]; if (s) s.delete(src);
    if (!s || s.size === 0) this.down[b] = false;
  }
  held(b) { return !!this.down[b]; }
  hit(b) { return !!this.pressed[b]; }
  any(...bs) { return bs.some(b => this.pressed[b]); }

    const touch = document.getElementById('touch');
    const showTouch = () => { touch.classList.add('on'); document.getElementById('pauseBtn').style.display = 'flex'; this.touchOn = true; };
    window.addEventListener('touchstart', showTouch, { passive:true });
    const isTouch = navigator.maxTouchPoints > 0 && matchMedia('(pointer:coarse)').matches;
    if (isTouch) showTouch();

      const el = document.getElementById(id);
      const on = e => { e.preventDefault(); this.game.audioKick(); buttons.forEach(b => this.press(b, id)); el.classList.add('active'); };
      const off = e => { e.preventDefault(); buttons.forEach(b => this.release(b, id)); el.classList.remove('active'); };

}

   ===================================================================== */
class ParticleSystem {
  constructor() { this.list = []; }
  add(p) {
    if (this.list.length > 700) return;
    this.list.push(Object.assign({ vx:0, vy:0, life:0.6, max:0, size:2, color:'#fff', grav:0, type:'sq', drag:0 }, p));
    const q = this.list[this.list.length - 1]; if (!q.max) q.max = q.life;
  }
  burst(x, y, n, color, spd = 80, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7), life = o.life || 0.4 + Math.random() * 0.4;
      this.add({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life, color: Array.isArray(color) ? color[i % color.length] : color,
        size:o.size || 2, grav:o.grav || 0, type:o.type || 'sq', drag:o.drag || 0 });
    }
  }
  dust(x, y, dir = 0) {
    for (let i = 0; i < 4; i++) this.add({ x:x + (Math.random() - 0.5) * 8, y:y - 2, vx:(Math.random() - 0.5) * 40 + dir * 30,
      vy:-Math.random() * 30, life:0.35, color:'rgba(240,230,210,0.9)', size:3, type:'dust' });
  }
  sparkle(x, y, color = '#fff7a8', n = 6) {
    for (let i = 0; i < n; i++) this.add({ x:x + (Math.random() - 0.5) * 12, y:y + (Math.random() - 0.5) * 12,
      vx:(Math.random() - 0.5) * 30, vy:-20 - Math.random() * 30, life:0.5 + Math.random() * 0.3, color, type:'star' });
  }
  debris(x, y, color) {
    for (let i = 0; i < 4; i++) this.add({ x:x + (i % 2) * 8 - 4, y:y + (i > 1 ? 4 : -4), vx:(i % 2 ? 1 : -1) * (40 + Math.random() * 40),
      vy:-220 + (i > 1 ? 80 : 0), grav:900, life:1.2, color, size:5, type:'sq' });
  }
  explosion(x, y, scale = 1) {
    this.burst(x, y, 14 * scale, ['#fff2a0','#ffb020','#ff5a1a','#ffffff'], 140 * scale, { size:3, drag:2 });
    this.burst(x, y, 6 * scale, 'rgba(90,80,90,0.8)', 50 * scale, { size:6, life:0.9, type:'dust' });
    this.add({ x, y, type:'ring', life:0.35, r:24 * scale, color:'#fff2a0' });
  }
  ring(x, y, color = '#fff', r = 24) { this.add({ x, y, type:'ring', life:0.4, r, color }); }
  text(x, y, str, color = '#fff') { this.add({ x, y, vy:-35, life:0.9, type:'text', text:str, color }); }
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.vy += p.grav * dt; if (p.drag) { p.vx *= 1 - Math.min(1, p.drag * dt); p.vy *= 1 - Math.min(1, p.drag * dt); }
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) L.splice(i, 1);
    }
  }
  draw(ctx, cx, cy) {
    for (const p of this.list) {
      const a = Math.min(1, (p.life / p.max) * 1.6);
      ctx.globalAlpha = a; const x = p.x - cx, y = p.y - cy;
      if (p.type === 'text') {
        ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
        ctx.fillStyle = '#000'; ctx.fillText(p.text, x + 1, y + 1); ctx.fillStyle = p.color; ctx.fillText(p.text, x, y);
      } else if (p.type === 'ring') {
        const k = 1 - p.life / p.max; ctx.strokeStyle = p.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 2 + k * p.r, 0, Math.PI * 2); ctx.stroke();
      } else if (p.type === 'line') {
        ctx.fillStyle = p.color; ctx.fillRect(Math.round(x - 5), Math.round(y), 10, 1);
      } else if (p.type === 'star') {
        ctx.fillStyle = p.color; ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3);
      } else {
        ctx.fillStyle = p.color; const s = p.type === 'dust' ? p.size * (0.5 + a * 0.5) : p.size;
        ctx.fillRect(Math.round(x - s / 2), Math.round(y - s / 2), Math.ceil(s), Math.ceil(s));
      }
    }
    ctx.globalAlpha = 1;
  }
}

/* =====================================================================
   ROOM + COLLISION
   ===================================================================== */
class Room {
  constructor(w, h, palette, bg) {
    this.w = w; this.h = h; this.palette = palette; this.bg = bg; this.tiles = new Uint8Array(w * h);
    this.contents = new Map(); this.enemies = []; this.items = []; this.platforms = []; this.hazards = []; this.zones = [];
    this.pipes = []; this.shots = []; this.collapse = new Map(); this.respawns = []; this.bumps = []; this.lights = [];
    this.togTime = 0; this.togPeriod = 2.4; this.castle = false; this.dark = false; this.music = 'w1'; this.tide = null; this.tideY = 999; this.auto = 0;
    this.heat = 0; this.heatX0 = 0; this.heatX1 = 0; this.onOff = true;
  }
  get(x, y) { if (x < 0 || x >= this.w) return T.STONE; if (y < 0 || y >= this.h) return T.EMPTY; return this.tiles[y * this.w + x]; }
  set(x, y, t) { if (x >= 0 && x < this.w && y >= 0 && y < this.h) this.tiles[y * this.w + x] = t; }
  togOn(t) { const a = Math.floor(this.togTime / this.togPeriod) % 2 === 0; return t === T.TOG_A ? a : !a; }
  togWarn(t) { return this.togOn(t) && (this.togTime % this.togPeriod) > this.togPeriod - 0.6; }
  solid(t) { return SOLID.has(t) || ((t === T.TOG_A || t === T.TOG_B) && this.togOn(t)) || (t === T.ONB && this.onOff) || (t === T.OFFB && !this.onOff); }
  solidAt(px, py) { return this.solid(this.get(Math.floor(px / TILE), Math.floor(py / TILE))); }
  zoneAt(x, type) { for (const z of this.zones) if (z.type === type && x >= z.x0 && x < z.x1) return z; return null; }
  update(dt, game) {
    const before = Math.floor(this.togTime / this.togPeriod);
    this.togTime += dt;
    if (Math.floor(this.togTime / this.togPeriod) !== before && this.hasTog) game.sound.sfx('laser');
    for (const [k, v] of this.collapse) {
      const nv = v - dt;
      if (nv <= 0) {
        this.collapse.delete(k); const x = k % this.w, y = Math.floor(k / this.w);
        this.tiles[k] = T.EMPTY; this.respawns.push({ k, t:5 });
        game.particles.debris(x * 16 + 8, y * 16 + 4, this.palette === 'citadel' ? '#9ad8ff' : PAL[this.palette].bridge);
        game.sound.sfx('crumble');
      } else this.collapse.set(k, nv);
    }
    for (let i = this.respawns.length - 1; i >= 0; i--) {
      const r = this.respawns[i]; r.t -= dt;
      if (r.t <= 0) {
        const x = r.k % this.w, y = Math.floor(r.k / this.w), p = game.player;
        const box = { x:x * 16, y:y * 16, w:16, h:16 };
        if (!Util.overlap(p, box)) { this.tiles[r.k] = T.COLLAPSE; this.respawns.splice(i, 1); }
      }
    }
    for (let i = this.bumps.length - 1; i >= 0; i--) { this.bumps[i].t -= dt; if (this.bumps[i].t <= 0) this.bumps.splice(i, 1); }
    if (this.tide) {
      const ph = ((game.levelTime + this.tide.offset) % this.tide.period) / this.tide.period, lo = 300, hi = this.tide.peak;
      let y = lo;
      if (ph > 0.5 && ph < 0.65) y = Util.lerp(lo, hi, (ph - 0.5) / 0.15);
      else if (ph >= 0.65 && ph < 0.82) y = hi;
      else if (ph >= 0.82 && ph < 0.97) y = Util.lerp(hi, lo, (ph - 0.82) / 0.15);
      this.tideWarn = ph > 0.4 && ph <= 0.5;
      this.tideY = y;
    }
  }
}

function moveBody(room, e, dt, opts) {
  opts = opts || {};
  const res = { l:false, r:false, u:false, d:false, head:[], floor:[] };
  if (e.vx) {
    e.x += e.vx * dt;
    const top = Math.floor(e.y / TILE), bot = Math.floor((e.y + e.h - 0.01) / TILE);
    if (e.vx > 0) { const tx = Math.floor((e.x + e.w - 0.01) / TILE);
      for (let y = top; y <= bot; y++) if (room.solid(room.get(tx, y))) { e.x = tx * TILE - e.w; res.r = true; break; } }
    else { const tx = Math.floor(e.x / TILE);
      for (let y = top; y <= bot; y++) if (room.solid(room.get(tx, y))) { e.x = (tx + 1) * TILE; res.l = true; break; } }
  }
  if (e.vy) {
    const oldY = e.y; e.y += e.vy * dt;
    const l = Math.floor(e.x / TILE), r = Math.floor((e.x + e.w - 0.01) / TILE);
    if (e.vy > 0) {
      const ty = Math.floor((e.y + e.h - 0.01) / TILE), top = ty * TILE;
      for (let x = l; x <= r; x++) { const t = room.get(x, ty);
        if (room.solid(t) || ((t === T.ONEWAY || t === T.CLOUD) && oldY + e.h <= top + 0.5 && !opts.drop)) { res.d = true; res.floor.push([x, ty, t]); } }
      if (res.d) e.y = top - e.h;
    } else {
      const ty = Math.floor(e.y / TILE);
      for (let x = l; x <= r; x++) { const t = room.get(x, ty);
        if (room.solid(t) || (t === T.HIDDEN && opts.hidden && oldY >= (ty + 1) * TILE - 0.5)) { res.u = true; res.head.push([x, ty, t]); } }
      if (res.u) e.y = (ty + 1) * TILE;
    }
  }
  return res;
}

class Enemy {
  constructor(w, h) {
    Object.assign(this, { w, h, x:0, y:0, vx:0, vy:0, facing:-1, alive:true, dying:false, squash:0, active:false, t:Math.random() * 3,

  }

  update(dt, g) {
    if (this.squash > 0) { this.squash -= dt; if (this.squash <= 0) this.remove = true; return; }
    if (this.dying) { this.vy += 900 * dt; this.y += this.vy * dt; this.x += this.vx * dt; if (this.y > 400) this.remove = true; return; }
    if (this.frozen > 0) { this.frozen -= dt; if (this.frozen <= 0) g.particles.burst(this.cx, this.y + this.h / 2, 8, ['#bfefff','#ffffff'], 60); return; }
    if (g.timeStop > 0 && !this.coinBug) return;
    this.t += dt; this.think(dt, g);
  }
  think(dt, g) { this.walk(dt, g); }
  walk(dt, g) {
    const room = g.room;

    if (this.turnAtLedge && this.grounded) {
      const fx = this.facing > 0 ? this.x + this.w + 2 : this.x - 2, fy = this.y + this.h + 4;
      const t = room.get(Math.floor(fx / 16), Math.floor(fy / 16));
      if (!room.solid(t) && t !== T.ONEWAY) { this.facing *= -1; this.vx = -this.vx; }
    }
    this.vy = Math.min(400, this.vy + 900 * dt);
    const res = moveBody(room, this, dt);
    if (res.l || res.r) this.facing *= -1;
    this.grounded = res.d; if (res.d) this.vy = 0;
    if (this.y > room.h * 16 + 32) this.remove = true;
  }
  squashKill(g) { this.alive = false; this.squash = 0.5; g.addScore(this.score, this.cx, this.y); g.sound.sfx('stomp'); g.impact(0.05, 2.5, 0.035); g.particles.burst(this.cx, this.y + this.h, 10, ['#fff','#ffe08a'], 90, { type:'star' }); g.particles.ring(this.cx, this.y + this.h / 2, '#fff', 18); }
  kill(g) {
    if (!this.alive) return; this.alive = false; this.dying = true; this.vy = -230; this.vx = (Math.random() < 0.5 ? -1 : 1) * 40;
    g.addScore(this.score, this.cx, this.y); g.sound.sfx('kick'); g.particles.burst(this.cx, this.y + this.h / 2, 12, ['#fff','#ffd34d','#ff8a3a'], 110, { size:3 }); g.particles.ring(this.cx, this.y + this.h / 2, '#ffd34d', 20); g.impact(0.04, 2, 0.02);
  }
  onStomp(g) { this.squashKill(g); return true; }
  onFire(g) { this.kill(g); return true; }
  onPound(g) { this.kill(g); }
  onIce(g) { if (!this.alive) return true; this.frozen = 6; this.vx = 0; g.sound.sfx('laser'); g.particles.burst(this.cx, this.y + this.h / 2, 8, ['#bfefff','#ffffff'], 60); return true; }
  touchPlayer(g, p) { p.hurt(); }
  drawDying(ctx, cx, cy) { ctx.save(); ctx.translate(Math.round(this.x - cx + this.w / 2), Math.round(this.y - cy + this.h / 2)); ctx.scale(1, -1); ctx.translate(-this.w / 2, -this.h / 2); this.sprite(ctx, 0, 0); ctx.restore(); }
  draw(ctx, cx, cy) {
    if (this.dying) return this.drawDying(ctx, cx, cy);
    const x = Math.round(this.x - cx), y = Math.round(this.y - cy);
    if (this.squash > 0) { ctx.save(); ctx.translate(x, y + this.h); ctx.scale(1, 0.35); ctx.translate(0, -this.h); this.sprite(ctx, 0, 0); ctx.restore(); return; }
    const bob = !this.ownBob && this.groundBound && Math.abs(this.vx) > 1 && !(this.frozen > 0) ? Math.round(-Math.abs(Math.sin(this.t * 9)) * 1.4) : 0;
    this.sprite(ctx, x, y + bob);
    if (this.frozen > 0) { ctx.fillStyle = 'rgba(150,215,255,0.55)'; ctx.fillRect(x - 2, y - 2, this.w + 4, this.h + 4); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.strokeRect(x - 1.5, y - 1.5, this.w + 3, this.h + 3); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(x, y, 3, 2); }
  }
  sprite() {}

    const res = moveBody(g.room, this, dt);
    if (res.l || res.r) { this.facing *= -1; g.sound.sfx('bump'); if (Math.abs(this.cx - g.cam.x - VW / 2) < VW) g.particles.burst(this.facing > 0 ? this.x : this.x + this.w, this.y + 7, 4, '#fff', 40); }

    else if (this.mode === 'spin') { this.mode = 'shell'; this.shellT = 0; }

    return true;
  }
  kick(g, dir) { this.mode = 'spin'; this.facing = dir; this.grace = 0.25; g.sound.sfx('kick'); g.addScore(400, this.cx, this.y); }
  touchPlayer(g, p) {

  }

    const r = (a, b, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x + a, y + b, w, h); };
    const shell = ({ frost:'#5ab0e0', desert:'#c8a050', jungle:'#3a8a2a', ocean:'#e05a4a', foundry:'#9a6a3a', candy:'#ff6ab0', haunted:'#6a4a8a', sky:'#e8eeff', neon:'#ff3ad0', crystal:'#a060ff', storm:'#5a5a7a', citadel:'#7a6ad8' })[(BIOMES[this.world] || BIOMES[0]).key] || '#2aa070', rim = '#c9a050';

      r(f ? 3 : 4, 12, 2, 2, '#e8d090'); r(f ? 9 : 8, 12, 2, 2, '#e8d090');
    } else {
      const sp = this.mode === 'spin' ? Math.floor(this.t * 20) % 2 : 0;
      r(1, 4, 12, 9, shell); r(2, 3, 10, 1, shell); r(1, 12, 12, 2, rim); r(sp ? 3 : 8, 6, 3, 3, 'rgba(255,255,255,0.5)');
      if (this.mode === 'shell' && this.shellT > 5 && Math.floor(this.t * 10) % 2) { r(3, 10, 2, 2, '#e8d090'); r(9, 10, 2, 2, '#e8d090'); }

class Boss {

    Object.assign(this, { g, ax:ax * 16, floor:GY * 16, t:0, state:'wait', st:0, hp:3, maxHp:3, flash:0, done:false, x:0, y:-200, w:32, h:32,

    if (!Util.overlap(p, this.hitbox())) return;
    const falling = p.vy > 0 || p.pound === 2, stomp = p.grav > 0 && falling && (p.y + p.h - p.vy * dt) <= this.y + 12;

      else if (this.hotTop()) { p.hurt(); p.vy = -280; }

  /* ---------- pause ---------- */

    if (inp.hit('down')) { this.pauseSel = (this.pauseSel + 1) % items.length; this.sound.sfx('move'); }
    if (inp.any('confirm','action','jump') && !inp.hit('up')) {

        case 3: this.controlsBack = 'pause'; this.state = 'controls'; break;
        case 4: this.resumeGame(); this.fadeTo(() => this.loadStage(this.stageIdx, true)); break;
        case 5: this.resumeGame(); this.fadeTo(() => this.goMap()); break;

  /* ---------- shops: every keeper sells something different ---------- */
  openShop(after, idx) {

    this.shopAfter = after; this.state = 'shop'; this.shopSel = 0; this.shopIdx = idx; const sh = SHOPS[idx];
    this.shopQuote = sh.quotes[Math.floor(Math.random() * sh.quotes.length)]; this.shopMsg = ''; this.shopBuyT = 0; this.sound.play('shop');
  }
  shopStock() { return SHOPS[this.shopIdx].stock.map(k => Object.assign({ key:k }, SHOP_ENTRY[k])); }
  shopInfo(it) {
    const s = this.save; s.badges = s.badges || {}; s.storage = s.storage || [];
    if (it.kind === 'up') { const lv = s.upgrades[it.key] || 0; return { lv, cost:it.cost(lv), maxed:lv >= it.max }; }
    if (it.kind === 'badge') return { cost:it.cost(), maxed:!!s.badges[it.badge] };
    if (it.kind === 'store') return { cost:it.cost(), full:s.storage.length >= 4 };

  }
  updateShop() {
    const inp = this.input, stock = this.shopStock(), n = stock.length + 1; if (this.shopBuyT > 0) this.shopBuyT -= 1 / 60;
    if (inp.any('up','nav_up')) { this.shopSel = (this.shopSel + n - 1) % n; this.sound.sfx('move'); }
    if (inp.any('down','nav_down')) { this.shopSel = (this.shopSel + 1) % n; this.sound.sfx('move'); }
    const leave = () => { this.writeSave(); this.sound.sfx('select'); const a = this.shopAfter; this.fadeTo(() => a()); };
    if (inp.any('back','pause')) return leave();
    if (inp.any('confirm','action') || (inp.hit('jump') && !inp.hit('up'))) {
      if (this.shopSel === stock.length) return leave();
      const it = stock[this.shopSel], info = this.shopInfo(it), s = this.save;
      if (info.maxed) { this.sound.sfx('error'); this.shopMsg = it.kind === 'badge' ? '"You already own that badge, silly!"' : '"Sold out! You already own the best model."'; return; }
      if (info.full) { this.sound.sfx('error'); this.shopMsg = '"Your item storage is full! Use something first."'; return; }
      if (it.kind === 'life' && s.lives >= 99) { this.sound.sfx('error'); this.shopMsg = '"Any more lives and you\'d need a bigger pocket."'; return; }
      if (s.shards < info.cost) { this.sound.sfx('error'); this.shopMsg = '"Not enough shards! Go smash some blocks!"'; return; }
      s.shards -= info.cost;
      if (it.kind === 'store') s.storage.push(it.item); else if (it.kind === 'life') s.lives++; else if (it.kind === 'up') s.upgrades[it.key] = (s.upgrades[it.key] || 0) + 1; else if (it.kind === 'badge') { s.badges[it.badge] = 1; if (!s.badge) s.badge = it.badge; }

      if (it.kind === 'badge') this.shopMsg = `"Equip it from the map with ${this.bindName('badge')}!"`; this.writeSave();
    }
  }

    for (const c of this.confetti || []) { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -1.5, c.w, 3 * Math.abs(Math.cos(c.r * 2)) + 1); ctx.restore(); }
    Art.pip(ctx, VW / 2 - 6, 244 - Math.abs(Math.sin(t * 5)) * 10, { big:true, power:0, facing:1, frame:0, state:'win', t, star:false, grav:1 });
    if (ct > 1.2 && ct < 50) ui.txt(ctx, 'SPACE: continue', VW - 24, VH - 10, { size:7, align:'right', color:'#c8c0e0' });
  }
  drawGameOver(ctx) {
    const ui = this.ui; ctx.fillStyle = '#06040e'; ctx.fillRect(0, 0, VW, VH);
    Art.gear(ctx, VW / 2, 110, 40, 12, this.time * 0.2, '#2a2040', '#06040e');
    ui.txt(ctx, 'TIME HAS RUN OUT', VW / 2, 120, { size:18, align:'center', color:'#ff6a8a' });
    ui.txt(ctx, 'Pip winds back up... your progress and shards are safe.', VW / 2, 160, { size:8, align:'center', color:'#c8c0e0' });
    if (this.goT > 1) ui.txt(ctx, 'Press SPACE to continue with 5 lives', VW / 2, 190, { size:9, align:'center', color:'#ffd34d' });
  }
  drawCredits(ctx) {
    const ui = this.ui, t = this.credT;
    Art.bg(ctx, 'meadow', this.time * 20, this.time, false); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, VW, VH);
    const lines = ['CHRONO-KINGDOM', 'THE UNWOUND PENDULUM', '', 'TIME IS FLOWING AGAIN!', '', 'Starring PIP, the clockwork courier', 'with Queen Horologia & Old Cuckoo', '',
      'Fourteen Core Gears from fourteen wild worlds', 'and Malakor the Unwound (now reformed-ish)', '', `Star-Medals found: ${this.totalMedals()}/${TOTAL_MEDALS}`, `Final score: ${this.save.score}`, '',
      this.bonusUnlocked() ? 'The STAR VAULT is open on the map!' : `Find ${BONUS_MEDALS} Star-Medals to open the Star Vault.`, '', 'Thanks for playing!'];
    lines.forEach((l, i) => { const y = 300 + i * 18 - t * 26; if (y > -10 && y < VH + 10) ui.txt(ctx, l, VW / 2, y, { size:i < 2 ? 14 : 9, align:'center', color:i < 2 ? '#ffd34d' : '#fff' }); });
    if (t > 2) ui.txt(ctx, 'SPACE: back to map', VW - 10, VH - 8, { size:7, align:'right', color:'#c8c0e0' });
  }
}

window.addEventListener('load', () => { window.__game = new Game(); });
if ('serviceWorker' in navigator && location.protocol === 'https:' && /chrono-kingdom/.test(location.pathname)) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
</script>
